<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Lecteur Web : de la musique pour tous</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon32.b64411e3.png">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="spotify-app">
    
    <!-- PANNEAU LATÉRAL (SIDEBAR) -->
    <aside class="sidebar">
      <!-- Nav Supérieure -->
      <nav class="card nav-menu">
        <div class="logo-container">
          <svg role="img" height="24" width="24" aria-hidden="true" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-1.2-.42-.18-.6.42-1.2 1.02-1.44C9.3 6.18 16.38 6.42 20.88 9.121c.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>
          <span class="logo-text">Spotify</span>
        </div>
        <ul>
          <li class="active" id="btn-home">
            <i data-lucide="home"></i>
            <span>Accueil</span>
          </li>
          <li id="btn-search-nav">
            <i data-lucide="search"></i>
            <span>Rechercher</span>
          </li>
        </ul>
      </nav>

      <!-- Bibliothèque -->
      <div class="card library-menu">
        <div class="library-header">
          <button class="lib-title-btn">
            <i data-lucide="library"></i>
            <span>Bibliothèque</span>
          </button>
          <div class="lib-actions">
            <button title="Créer une playlist"><i data-lucide="plus"></i></button>
            <button title="Agrandir la bibliothèque"><i data-lucide="arrow-right"></i></button>
          </div>
        </div>

        <div class="pills-container">
          <button class="pill active">Playlists</button>
          <button class="pill">Artistes</button>
          <button class="pill">Podcasts</button>
        </div>

        <div class="library-items" id="library-items">
          <!-- Généré par JS -->
        </div>
      </div>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <main class="main-view">
      <!-- Header Supérieur -->
      <header class="top-header">
        <div class="header-nav">
          <button class="circle-btn"><i data-lucide="chevron-left"></i></button>
          <button class="circle-btn"><i data-lucide="chevron-right"></i></button>
          
          <div class="header-search-bar hidden" id="header-search">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" placeholder="Que souhaitez-vous écouter ?" id="search-input" onkeyup="handleSearch(event)">
          </div>
        </div>

        <div class="header-user">
          <button class="badge-btn glow">Explorer Premium</button>
          <button class="badge-btn dark"><i data-lucide="arrow-down-to-line"></i> Installer l'app</button>
          <button class="circle-btn"><i data-lucide="bell"></i></button>
          <button class="profile-avatar">S</button>
        </div>
      </header>

      <!-- VUE DYNAMIQUE -->
      <div class="content-view" id="content-view">
        <!-- Rempli par JavaScript -->
      </div>
    </main>

    <!-- LECTEUR DU BAS (PLAYER) -->
    <footer class="player-bar">
      <div class="player-left">
        <img src="https://i.scdn.co/image/ab67616d0000b273ba0be73c727db43b8110e0e1" alt="Cover" id="player-img">
        <div class="song-meta">
          <span class="song-name" id="player-title">Blinding Lights</span>
          <span class="song-artist" id="player-artist">The Weeknd</span>
        </div>
        <button class="like-btn" id="like-btn"><i data-lucide="heart"></i></button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button title="Activer la lecture aléatoire"><i data-lucide="shuffle"></i></button>
          <button title="Précédent" onclick="prevSong()"><i data-lucide="skip-back"></i></button>
          <button class="play-circle" id="master-play" onclick="togglePlay()"><i data-lucide="play"></i></button>
          <button title="Suivant" onclick="nextSong()"><i data-lucide="skip-forward"></i></button>
          <button title="Répéter"><i data-lucide="repeat"></i></button>
        </div>
        <div class="progress-container">
          <span class="time-label" id="current-time">0:00</span>
          <div class="bar-bg" onclick="seek(event)">
            <div class="bar-fill" id="progress-fill"></div>
          </div>
          <span class="time-label" id="total-time">3:20</span>
        </div>
      </div>

      <div class="player-right">
        <button><i data-lucide="mic-2"></i></button>
        <button><i data-lucide="list-music"></i></button>
        <button><i data-lucide="laptop-2"></i></button>
        <div class="volume-container">
          <button><i data-lucide="volume-2"></i></button>
          <div class="bar-bg">
            <div class="bar-fill" style="width: 80%;"></div>
          </div>
        </div>
      </div>
    </footer>

  </div>

  <div id="yt-player" style="display:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
