<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound - Music & Lyrics</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- OVERLAY PLEIN ÉCRAN POUR LES PAROLES -->
  <div id="fullscreen-lyrics" class="fullscreen-lyrics-overlay hidden">
    <button class="close-fullscreen-btn" onclick="toggleFullscreenLyrics()"><i data-lucide="x"></i></button>
    <div class="fullscreen-lyrics-content" id="fullscreen-lyrics-box">
      <!-- Paroles géantes générées en JS -->
    </div>
  </div>

  <div class="spotify-app" id="app-container">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="card nav-menu">
        <div class="logo-container">
          <i data-lucide="disc-3" style="width: 28px; height: 28px; color: var(--accent-color);"></i>
          <span class="logo-text">Sound</span>
        </div>
        <ul>
          <li class="active" id="btn-home"><i data-lucide="home"></i><span>Accueil</span></li>
          <li id="btn-search-nav"><i data-lucide="search"></i><span>Rechercher</span></li>
        </ul>
      </nav>

      <div class="card library-menu">
        <div class="library-header">
          <button class="lib-title-btn"><i data-lucide="library"></i><span>Bibliothèque</span></button>
        </div>
      </div>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <main class="card main-view">
      <header class="top-header">
        <div class="header-nav">
          <button class="circle-btn"><i data-lucide="chevron-left"></i></button>
          <button class="circle-btn"><i data-lucide="chevron-right"></i></button>
          
          <div class="header-search-bar" id="header-search">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" placeholder="Rechercher un titre..." id="search-input">
          </div>
        </div>

        <div class="header-user">
          <select class="theme-select" id="theme-select" onchange="changeTheme(this.value)">
            <option value="default">Thème Original</option>
            <option value="neon">Thème Néon Cyber</option>
            <option value="dracula">Thème Dracula</option>
          </select>
          <button class="circle-btn"><i data-lucide="bell"></i></button>
          <button class="profile-avatar circle-btn">S</button>
        </div>
      </header>

      <div class="content-view" id="content-view"></div>
    </main>

    <!-- VOLET DROIT - PAROLES -->
    <aside class="card right-panel" id="right-panel">
      <div class="right-panel-header">
        <span class="right-panel-title">Paroles en direct</span>
        <div style="display: flex; gap: 8px;">
          <button class="circle-btn" title="Plein écran" onclick="toggleFullscreenLyrics()"><i data-lucide="maximize-2"></i></button>
          <button class="circle-btn" onclick="toggleRightPanel()"><i data-lucide="x"></i></button>
        </div>
      </div>

      <div class="lyrics-container" id="lyrics-box">
        <!-- Paroles latérales -->
      </div>
    </aside>

    <!-- PLAYER DU BAS -->
    <footer class="card player-bar">
      <div class="player-left">
        <img src="" id="player-img" alt="Cover">
        <div class="song-meta">
          <span class="song-name" id="player-title">-</span>
          <span class="song-artist" id="player-artist">-</span>
        </div>
        <button class="download-btn" title="Télécharger la musique" onclick="downloadCurrentSong()"><i data-lucide="download"></i></button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button onclick="prevSong()"><i data-lucide="skip-back"></i></button>
          <button class="play-circle" id="master-play" onclick="togglePlay()"><i data-lucide="play"></i></button>
          <button onclick="nextSong()"><i data-lucide="skip-forward"></i></button>
        </div>
        <div class="progress-container">
          <span class="time-label" id="current-time">0:00</span>
          <div class="bar-bg"><div class="bar-fill" id="progress-fill"></div></div>
          <span class="time-label" id="total-time">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button title="Mode plein écran paroles" onclick="toggleFullscreenLyrics()"><i data-lucide="maximize-2"></i></button>
        <button title="Paroles synchro" onclick="toggleRightPanel()"><i data-lucide="mic-2"></i></button>
      </div>
    </footer>

  </div>

  <div id="yt-player" style="display:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
